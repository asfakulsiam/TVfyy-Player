name: TVfyy Player CI/CD - Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-disabled: false

      - name: Prepare Signing Keystore
        id: prepare_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding production release keystore from GitHub Secrets..."
            mkdir -p app
            # Cleanly decode base64 into app/tvfyy-player-release.jks ignoring any potential whitespace or trailing newlines
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/tvfyy-player-release.jks 2>/dev/null || \
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > app/tvfyy-player-release.jks

            # Validate decoded keystore file exists and is not empty
            if [ ! -s app/tvfyy-player-release.jks ]; then
              echo "::error::Decoded keystore file is empty or corrupted. Please verify the KEYSTORE_BASE64 GitHub Secret."
              exit 1
            fi

            KS_SIZE=$(wc -c < app/tvfyy-player-release.jks)
            echo "Keystore successfully decoded ($KS_SIZE bytes)."

            echo "KEYSTORE_PATH=${{ github.workspace }}/app/tvfyy-player-release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::No KEYSTORE_BASE64 secret found. Falling back to temporary debug keystore for CI verification."
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Ensure Fallback Keystore Exists
        if: steps.prepare_keystore.outputs.has_keystore != 'true'
        run: |
          if [ ! -f "${{ github.workspace }}/debug.keystore" ]; then
            echo "Generating fallback debug keystore for CI runner..."
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore ${{ github.workspace }}/debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Run Unit & JVM Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK & Bundle
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare Artifacts & Checksums
        id: prepare_artifacts
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          VERSION="${VERSION#v}"
          mkdir -p release_dist

          # Copy APK if generated
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_dist/TVfyy-Player-v${VERSION}.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_dist/TVfyy-Player-v${VERSION}-unsigned.apk
          fi

          # Copy AAB if generated
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab release_dist/TVfyy-Player-v${VERSION}.aab
          fi

          # Generate SHA256 checksums
          cd release_dist
          sha256sum * > SHA256SUMS.txt || true
          cd ..

          # Write GitHub Step Summary
          echo "## 🚀 TVfyy Player Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | File Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for file in release_dist/*; do
            if [ -f "$file" ]; then
              fname=$(basename "$file")
              fsize=$(ls -lh "$file" | awk '{print $5}')
              echo "| \`$fname\` | $fsize |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔑 SHA256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat release_dist/SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TVfyy-Player-Build-Artifacts
          path: release_dist/
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_dist/*.apk
            release_dist/*.aab
            release_dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
