name: TVfyy Player CI/CD - Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-disabled: true

      - name: Prepare Signing Keystore
        id: prepare_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - << 'EOF'
          import os, sys, base64, subprocess

          b64_val = os.environ.get("KEYSTORE_BASE64", "").strip()
          store_pass = os.environ.get("KEYSTORE_PASSWORD", "")
          key_alias = os.environ.get("KEY_ALIAS", "")
          key_pass = os.environ.get("KEY_PASSWORD", "")

          if not b64_val:
              print("::warning::No KEYSTORE_BASE64 secret found. Falling back to debug keystore for CI.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("has_keystore=false\n")
              sys.exit(0)

          os.makedirs("app", exist_ok=True)
          clean_b64 = "".join(b64_val.split())
          pad_rem = len(clean_b64) % 4
          if pad_rem:
              clean_b64 += "=" * (4 - pad_rem)

          try:
              ks_data = base64.b64decode(clean_b64)
          except Exception as e:
              print(f"::error::Failed to decode KEYSTORE_BASE64: {e}")
              sys.exit(1)

          if len(ks_data) < 500:
              print(f"::error::Decoded keystore is suspiciously small ({len(ks_data)} bytes). Please verify the secret.")
              sys.exit(1)

          ks_path = os.path.abspath("app/tvfyy-player-release.jks")
          with open(ks_path, "wb") as f:
              f.write(ks_data)

          print(f"Successfully reconstructed keystore at {ks_path} ({len(ks_data)} bytes).")

          # Safe keytool verification if password provided
          if store_pass:
              kt = subprocess.run(["keytool", "-list", "-keystore", ks_path, "-storepass", store_pass], capture_output=True, text=True)
              if kt.returncode != 0:
                  print("::warning::Keytool password check failed with provided KEYSTORE_PASSWORD. Please verify secret.")
              else:
                  print("Keystore integrity and password verified successfully.")
                  if key_alias and key_alias in kt.stdout:
                      print(f"Verified alias '{key_alias}' exists in keystore.")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"KEYSTORE_PATH={ks_path}\n")
              f.write(f"STORE_PASSWORD={store_pass}\n")
              f.write(f"KEY_ALIAS={key_alias}\n")
              f.write(f"KEY_PASSWORD={key_pass}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("has_keystore=true\n")
          EOF

      - name: Ensure Fallback Keystore Exists
        if: steps.prepare_keystore.outputs.has_keystore != 'true'
        run: |
          if [ ! -f "${{ github.workspace }}/debug.keystore" ]; then
            echo "Generating fallback debug keystore for CI runner..."
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore ${{ github.workspace }}/debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Run Unit & JVM Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK & Bundle
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare Artifacts & Checksums
        id: prepare_artifacts
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          VERSION="${VERSION#v}"
          mkdir -p release_dist

          # Copy APK if generated
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_dist/TVfyy-Player-v${VERSION}.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_dist/TVfyy-Player-v${VERSION}-unsigned.apk
          fi

          # Copy AAB if generated
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab release_dist/TVfyy-Player-v${VERSION}.aab
          fi

          # Generate SHA256 checksums
          cd release_dist
          sha256sum * > SHA256SUMS.txt || true
          cd ..

          # Write GitHub Step Summary
          echo "## 🚀 TVfyy Player Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | File Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for file in release_dist/*; do
            if [ -f "$file" ]; then
              fname=$(basename "$file")
              fsize=$(ls -lh "$file" | awk '{print $5}')
              echo "| \`$fname\` | $fsize |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔑 SHA256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat release_dist/SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Extract Release Notes from CHANGELOG
        run: |
          python3 - << 'EOF'
          import os, re

          notes = ""
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  content = f.read()
              
              # Extract the latest version section (between the first ## [version] and next ## [version] or EOF)
              match = re.search(r'(##\s*\[.*?\][^\n]*\n(?:.|\n)*?)(?=\n##\s*\[|\Z)', content)
              if match:
                  notes = match.group(1).strip()

          if not notes:
              notes = "### What's New in TVfyy Player\n- Automatic release build with performance improvements and bug fixes."

          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")

          print("Generated RELEASE_NOTES.md for GitHub Release:")
          print(notes)
          EOF

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TVfyy-Player-Build-Artifacts
          path: release_dist/
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event.inputs.create_release == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('TVfyy Player {0}', github.ref_name) || format('TVfyy Player v1.0.{0}', github.run_number) }}
          body_path: RELEASE_NOTES.md
          files: |
            release_dist/*.apk
            release_dist/*.aab
            release_dist/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
